name: Refresh Pipeline Data

on:
  schedule:
    # 6:30 PM ET = 23:30 UTC (winter) / 22:30 UTC (summer)
    # Use 23:00 UTC as a safe daily slot after market close
    - cron: '0 23 * * 1-5'  # weekdays only
  workflow_dispatch:  # also allow manual triggering from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit back to repo
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py --refresh --no-trajectory
      
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/src/data/ output/
          git diff --cached --quiet || git commit -m "Auto-refresh: $(date -u +%Y-%m-%d)"
          git push