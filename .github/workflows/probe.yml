name: probe-data-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q yfinance pandas
      - name: Can a GitHub runner reach Yahoo, SEC, FRED?
        run: |
          python - <<'PY'
          import yfinance as yf, urllib.request, time
          t0=time.time()
          df = yf.download(["AAPL","MSFT","AX","TDS","CCOI"], period="5d",
                           progress=False, group_by="ticker",
                           threads=True, auto_adjust=True)
          print(f"YAHOO: shape={df.shape} in {time.time()-t0:.1f}s")
          assert not df.empty and df.shape[0] >= 3, "YAHOO BLOCKED/EMPTY"
          closes = {t: float(df[t]['Close'].dropna().iloc[-1]) for t in ["AAPL","AX","CCOI"]}
          print("YAHOO last closes:", closes)
          req = urllib.request.Request("https://www.sec.gov/files/company_tickers.json",
                                       headers={"User-Agent":"IMA-Risk-Screener/1.0 (dani@navaslabs.com)"})
          print("SEC:", len(urllib.request.urlopen(req, timeout=30).read()), "bytes")
          print("FRED reachable:", urllib.request.urlopen("https://api.stlouisfed.org/", timeout=20).status)
          print("ALL SOURCES OK FROM GITHUB RUNNER")
          PY
